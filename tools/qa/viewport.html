<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CURSED PAWN — viewport QA</title>
<!--
  QA 보조 페이지: 고정 크기 뷰포트에서 게임을 띄워 스크린샷을 찍는다.
  사용: tools/qa/viewport.html?w=1280&h=800  /  ?w=390&h=844
  (배포 빌드에는 포함되지 않는다 — package.json build.files 는 tools/ 를 제외한다)

  스크립트는 인라인이다: QA 중 GitHub Pages(10분 캐시)의 낡은 JS 가 물리지 않도록.
-->
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #050403; overflow: auto; }
  #frame { display: block; border: 0; background: #0a0705; }
</style>
</head>
<body>
<iframe id="frame" src="../../index.html?v=1.2.4" title="CURSED PAWN"></iframe>
<script>
(function () {
  var q = new URLSearchParams(window.location.search);
  var w = Math.max(320, Math.min(1920, parseInt(q.get('w') || '1280', 10) || 1280));
  var h = Math.max(480, Math.min(1200, parseInt(q.get('h') || '800', 10) || 800));
  var f = document.getElementById('frame');
  f.width = w; f.height = h;
  f.style.width = w + 'px'; f.style.height = h + 'px';
  f.src = '../../index.html?v=' + encodeURIComponent(q.get('v') || String(Date.now()));
  document.title = 'CURSED PAWN — ' + w + '×' + h;
})();
</script>
</body>
</html>
